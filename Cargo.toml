[package]
name = "screencopy-plus"
version = "5.0.1"
edition = "2021"
authors = ["ScreenCopyPLUS Contributors"]
description = "ScreenCopyPLUS - Supercharged Android Mirroring & Easy File Transfer Manager in Rust"

[dependencies]
eframe = { version = "0.29", default-features = true }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
chrono = "0.4"
